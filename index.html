function initCharts(){

  if(cv1&&!cv1._c)cv1._c=new Chart(cv1,{type:'bar',data:{labels:['Ene','Feb','Mar','Abr'],datasets:[{label:'Ingresos',data:[3007220,3719200,256080,142500],backgroundColor:'#639922',borderWidth:0},{label:'Egresos',data:[6244312,8471603,0,107480],backgroundColor:'#E24B4A',borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{color:gc},ticks:{color:tc,font:{size:12}}},y:{grid:{color:gc},ticks:{color:tc,font:{size:11},callback:v=>v>=1000000?(v/1000000).toFixed(1)+'M':'Bs.'+(v/1000).toFixed(0)+'k'}}}}});
  const cv2=document.getElementById('ch2');
  if(cv2&&!cv2._c)cv2._c=new Chart(cv2,{type:'bar',data:{labels:['Sep','Oct','Nov','Dic','Ene','Feb','Mar','Abr'],datasets:[{label:'Ingresos',data:[584237,96213,1956367,2716480,3007220,3719200,256080,142500],backgroundColor:'#639922',borderWidth:0},{label:'Egresos',data:[411864,201580,2289513,7090160,6244312,8471603,0,107480],backgroundColor:'#E24B4A',borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{color:gc},ticks:{color:tc,font:{size:11}}},y:{grid:{color:gc},ticks:{color:tc,font:{size:10},callback:v=>v>=1000000?(v/1000000).toFixed(1)+'M':'Bs.'+(v/1000).toFixed(0)+'k'}}}}});
  // Fisc dash
  renderFiscDash();
}
function renderFiscDash(){
  const c=document.getElementById('fisc-dash');if(!c)return;
  const pag=OBLIG.filter(o=>fiscPag[o.id]).length;
  const e1=document.getElementById('fd-p'),e2=document.getElementById('fd-pe'),e3=document.getElementById('fd-v');
  if(e1)e1.textContent=pag;if(e2)e2.textContent=OBLIG.length-pag;if(e3)e3.textContent=OBLIG.filter(o=>!fiscPag[o.id]&&o.d<0).length;
  c.innerHTML=OBLIG.slice(0,4).map(ob=>{const{dc,ds,bc}=fiscData(ob);
    return`<div class="fi"><div class="fi-dot ${dc}"></div><div class="fi-info"><div class="fi-nom">${ob.n}</div><div class="fi-fec">Vence: ${ob.v} — ${ob.m}</div></div><span class="badge ${bc}">${fiscPag[ob.id]?'Pagado':ob.d<0?'Vencido':ob.d<=7?'Próximo':'Ok'}</span></div>`;
  }).join('');
}
function cambiarMes(dir){mesActual=Math.max(0,Math.min(8,mesActual+dir));renderMes();}
function renderMes(){
  const d=MD[mesActual];if(!d)return;
  document.getElementById('mes-lbl').textContent=d.lbl;
  const b=document.getElementById('mes-badge');b.textContent=mesActual===8?'Mes actual':'Histórico';b.className='badge '+(mesActual===8?'bb':'bgr');
  document.getElementById('mes-ing').textContent='Bs. '+fmt(d.ing);
  document.getElementById('mes-eg').textContent='Bs. '+fmt(d.eg);
  const bal=d.ing-d.eg;const bl=document.getElementById('mes-bal');bl.textContent='Bs. '+fmt(bal);bl.style.color=bal>=0?'#185FA5':'#A32D2D';

function renderIncon(d){
  const c=document.getElementById('inc-lista');
  if(!d.inc.length){c.innerHTML='<div style="font-size:14px;color:var(--text2);padding:12px 0">Sin incongruencias este mes.</div>';return;}
  c.innerHTML=d.inc.map(ic=>`<div class="incon" onclick="irAMov(${ic.mi})"><div style="flex:1"><div class="incon-tipo">${ic.tipo===1?'Tipo 1 — Banco vs sistema':'Tipo 2 — Partida interna'}</div><div class="incon-desc">${ic.desc}</div><div style="font-size:12px;color:#A32D2D;margin-top:4px">Toca para ver el movimiento exacto</div></div><div class="incon-monto">${ic.monto}</div></div>`).join('');
}
function irAMov(idx){
  document.getElementById('mov-filt').value='';filtMov();
  setTimeout(()=>{const rows=document.querySelectorAll('#mov-tbody tr');if(rows[idx]){rows[idx].scrollIntoView({behavior:'smooth',block:'center'});rows[idx].style.outline='3px solid #E24B4A';rows[idx].style.outlineOffset='2px';setTimeout(()=>{rows[idx].style.outline='';rows[idx].style.outlineOffset='';},3000);}},100);
}
function renderMov(d,filt){
  const tb=document.getElementById('mov-tbody');
  let movs=d.mov;
  if(filt==='ing')movs=movs.filter(m=>m.t==='ing');
  else if(filt==='eg')movs=movs.filter(m=>m.t==='eg');
  else if(filt==='inc')movs=movs.filter(m=>m.i);
  if(!movs.length){tb.innerHTML='<tr><td colspan="7" style="text-align:center;color:var(--text2);padding:20px">Sin movimientos para este filtro.</td></tr>';return;}
  tb.innerHTML=movs.map(m=>{
    const ms=m.m>0?`<span style="color:#3B6D11;font-weight:600">+${fmt(m.m)}</span>`:`<span style="color:#A32D2D">${fmt(m.m)}</span>`;
    return`<tr class="${m.i?'mov-inc':''}"><td>${m.f}</td><td title="${m.d}">${m.d}</td><td style="font-size:11px">${m.p}</td><td>${m.b}</td><td>${ms}</td><td style="color:var(--text2)">$${Math.round(Math.abs(m.m)/BCV)}</td><td>${m.i?'<span class="badge ba">Revisar</span>':m.t==='ing'?'<span class="badge bg">Ingreso</span>':'<span class="badge bgr">Egreso</span>'}</td></tr>`;
  }).join('');
}
function filtMov(){renderMov(MD[mesActual],document.getElementById('mov-filt').value);}
function fiscData(ob){
  const pg=fiscPag[ob.id];
  if(pg)return{dc:'fv',ds:'Pagado',dcs:'fd-ok',bc:'bg'};
  if(ob.d<0)return{dc:'fr',ds:'Vencido hace '+Math.abs(ob.d)+' días',dcs:'fd-urg',bc:'br'};
  if(ob.d<=7)return{dc:'fn',ds:'Vence en '+ob.d+' días',dcs:'fd-pr',bc:'ba'};
  return{dc:'fv',ds:'Vence en '+ob.d+' días',dcs:'fd-ok',bc:'bgr'};
}
function renderFiscDir(){
  const c=document.getElementById('fisc-dir');if(!c)return;
  c.innerHTML=OBLIG.map(ob=>{const{dc,ds,dcs,bc}=fiscData(ob);
    return`<div class="fi"><div class="fi-dot ${dc}"></div><div class="fi-info"><div class="fi-nom">${ob.n}</div><div class="fi-fec">Vence: ${ob.v} — ${ob.m} — ${ob.per}</div></div><div class="fi-dias ${dcs}" style="margin-right:10px">${ds}</div><span class="badge ${bc}">${fiscPag[ob.id]?'Pagado':ob.d<0?'Vencido':ob.d<=7?'Próximo':'Ok'}</span></div>`;
  }).join('');
}

function updSaldo(){
  const f=document.getElementById('saldo-fc'),b=document.getElementById('saldo-bc'),p=document.getElementById('saldo-pv'),t=document.getElementById('saldo-tot'),u=document.getElementById('ul-reg');
  if(f)f.textContent='Bs. '+fmt(saldos.fc);if(b)b.textContent='Bs. '+fmt(saldos.bc);if(p)p.textContent='Bs. '+fmt(saldos.pv);
  if(t)t.textContent='Bs. '+fmt(saldos.fc+saldos.bc+saldos.pv);
  const now=new Date();if(u)u.textContent='Último registro: '+now.getHours()+':'+String(now.getMinutes()).padStart(2,'0');
}
function updBanco(banco,monto){
  if(banco==='Fondo Común')saldos.fc=Math.max(0,saldos.fc+monto);
  else if(banco==='Bancaribe')saldos.bc=Math.max(0,saldos.bc+monto);
  else if(banco==='Provincial')saldos.pv=Math.max(0,saldos.pv+monto);
  updSaldo();
}

function filtrarGrado(grado,ctx){
  gradoFiltro=grado;
  const pills=document.querySelectorAll(`#grado-pills-${ctx} .grade-pill`);
  pills.forEach(p=>p.classList.toggle('active',p.textContent===grado));
  if(ctx==='cob'){
    const sel=document.getElementById('cob-alu');
    Array.from(sel.options).forEach(o=>{
      if(!o.value){o.style.display='';return;}
      o.style.display=(grado==='Todos'||o.dataset.grado===grado)?'':'none';
    });
    sel.value='';document.getElementById('cob-wrap').style.display='none';
  }
  if(ctx==='mat'){
    document.querySelectorAll('#mat-tbody tr').forEach(r=>{
      r.style.display=(grado==='Todos'||r.dataset.grado===grado)?'':'none';
    });
    document.getElementById('mat-titulo').textContent=grado==='Todos'?'Alumnos — año escolar 2025–2026':grado+' — año escolar 2025–2026';
  }
  if(ctx==='eca'){
    const sel=document.getElementById('eca-alu');
    Array.from(sel.options).forEach(o=>{
      if(!o.value){o.style.display='';return;}
      o.style.display=(grado==='Todos'||o.dataset.grado===grado)?'':'none';
    });
    sel.value='';document.getElementById('eca-res').style.display='none';
  }
}
function loadMeses(){
  const idx=parseInt(document.getElementById('cob-alu').value);
  const wrap=document.getElementById('cob-wrap');
  if(isNaN(idx)){wrap.style.display='none';return;}
  wrap.style.display='block';
  cobSel={};
  renderGrid(idx);
  document.getElementById('cob-det-wrap').style.display='none';
  document.getElementById('cob-res').classList.remove('vis');
}
function renderGrid(idx){
  const a=ALUMNOS[idx];const grid=document.getElementById('cob-grid');
  grid.innerHTML=ML.map((m,i)=>{
    if(i<a.mi)return`<div class="mc na"><span class="mi">—</span><span class="ml">${m}</span><span class="mm">N/A</span></div>`;
    if(i>MA)return`<div class="mc fut"><span class="mi">—</span><span class="ml">${m}</span><span class="mm">—</span></div>`;
    if(a.p[i])return`<div class="mc pag"><span class="mi">✓</span><span class="ml">${m}</span><span class="mm">Pagado</span></div>`;
    const cls=cobSel[i]!==undefined?'sel':'deu';
    return`<div class="mc ${cls}" onclick="togMes(${i},${idx})"><span class="mi">${cobSel[i]!==undefined?'●':'✗'}</span><span class="ml">${m}</span><span class="mm">$${TAR[a.t]}</span></div>`;
  }).join('');
}
function togMes(i,idx){
  const a=ALUMNOS[idx];
  if(cobSel[i]!==undefined){delete cobSel[i];}
  else{cobSel[i]=TAR[a.t]*BCV;}
  renderGrid(idx);
  const keys=Object.keys(cobSel).map(Number);
  const dw=document.getElementById('cob-det-wrap');
  if(keys.length){dw.style.display='block';renderDetalle(idx,keys);}
  else{dw.style.display='none';document.getElementById('cob-res').classList.remove('vis');}
}
function renderDetalle(idx,keys){
  const a=ALUMNOS[idx];const df=document.getElementById('cob-det');df.innerHTML='';
  keys.sort((x,y)=>x-y).forEach(i=>{
    const tar=TAR[a.t]*BCV;
    const row=document.createElement('div');
    row.style.cssText='display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--bg2);border-radius:var(--r);margin-bottom:7px;flex-wrap:wrap';
    row.innerHTML=`<div style="font-size:13px;font-weight:700;min-width:80px">${MF[i]}</div><div style="font-size:12px;color:var(--text2);flex:1">Total: Bs. ${fmt(tar)} ($${TAR[a.t]})</div><div style="display:flex;align-items:center;gap:7px"><label style="font-size:12px;color:var(--text2)">Bs. hoy:</label><input style="width:110px;font-size:13px;padding:6px 8px;border:1px solid var(--border2);border-radius:var(--r);background:var(--bg);text-align:right" type="number" value="${Math.round(cobSel[i]||tar)}" oninput="updCobMes(${i},this.value,${idx})"></div><div style="font-size:12px;font-weight:700;min-width:80px;text-align:right" id="ce-${i}"></div>`;
    df.appendChild(row);updCobMes(i,cobSel[i]||tar,idx);
  });
  renderResCob(idx,keys);
}
function updCobMes(i,val,idx){
  const a=ALUMNOS[idx];const v=parseFloat(val)||0;cobSel[i]=v;
  const saldo=(TAR[a.t]*BCV)-a.a[i];const el=document.getElementById('ce-'+i);
  if(el)el.innerHTML=v>=saldo?'<span class="badge bg">Completo</span>':v>0?'<span class="badge ba">Abono</span>':'<span class="badge br">Sin monto</span>';
  renderResCob(idx,Object.keys(cobSel).map(Number).sort((x,y)=>x-y));
}
function renderResCob(idx,keys){
  const a=ALUMNOS[idx];const res=document.getElementById('cob-res');
  if(!keys.length){res.classList.remove('vis');return;}
  let tot=0;const fil=document.getElementById('cob-res-filas');fil.innerHTML='';
  // conceptos adicionales
  const conc=document.getElementById('cob-concepto')?.value||'';
  let extUSD=0;
  if(conc==='ins')extUSD=150;else if(conc==='se')extUSD=30;else if(conc==='ce')extUSD=20;else if(conc==='ins+se+ce')extUSD=200;
  if(extUSD>0)fil.innerHTML+=`<div style="display:flex;justify-content:space-between;font-size:13px;padding:3px 0"><span style="color:var(--pd)">${conc.toUpperCase()} USD $${extUSD}</span><span style="font-weight:700;color:#854F0B">Bs. ${fmt(extUSD*BCV)}</span></div>`;
  tot+=extUSD*BCV;
  keys.forEach(i=>{const monto=parseFloat(cobSel[i])||0;const saldo=(TAR[a.t]*BCV)-a.a[i];const comp=monto>=saldo;tot+=monto;
    fil.innerHTML+=`<div style="display:flex;justify-content:space-between;font-size:13px;padding:3px 0"><span style="color:var(--pd)">${MF[i]}${comp?' ✓':' (abono)'}</span><span style="font-weight:700;color:${comp?'#3B6D11':'#854F0B'}">Bs. ${fmt(monto)}</span></div>`;
  });
  document.getElementById('cob-total').textContent='Bs. '+fmt(tot);
  document.getElementById('cob-usd').textContent='USD '+(tot/BCV).toFixed(2)+' — tasa BCV Bs. '+BCV;
  res.classList.add('vis');
}
function regCobro(){
  const keys=Object.keys(cobSel).map(Number);
  const conc=document.getElementById('cob-concepto')?.value||'';
  let extUSD=0;
  if(conc==='ins')extUSD=150;else if(conc==='se')extUSD=30;else if(conc==='ce')extUSD=20;else if(conc==='ins+se+ce')extUSD=200;
  if(!keys.length&&!extUSD){alert('Selecciona al menos un mes o concepto.');return;}
  let tot=extUSD*BCV;keys.forEach(i=>tot+=(parseFloat(cobSel[i])||0));
  const banco=document.getElementById('cob-banco').value;
  updBanco(banco,tot);
  const ref=document.getElementById('cob-ref')?.value||'—';
  // agregar a mis registros
  const idx=parseInt(document.getElementById('cob-alu').value);
  const a=ALUMNOS[idx];
  misRegistros.unshift({id:Date.now(),f:new Date().toLocaleDateString('es-VE',{day:'2-digit',month:'2-digit'}),d:`Cobro ${a?a.n:'alumno'} — ${keys.map(i=>ML[i]).join(',')}${extUSD?' + '+conc.toUpperCase():''}`,p:'INGRESOS FACTURACIÓN',b:banco,m:tot,t:'ing'});
  renderMisReg();
  // Guardar en Google Sheets
  const idxAlu = parseInt(document.getElementById('cob-alu').value);
  const aluNom = !isNaN(idxAlu) ? ALUMNOS[idxAlu].n : 'N/A';
  saveCobro(aluNom, Object.keys(cobSel).map(i=>ML[i]), tot, banco, document.getElementById('cob-fecha')?.value||'', BCV, ref).then(ok=>{
    alert('✅ Cobro registrado\nBs. '+fmt(tot)+' en '+banco+'\nRef: '+ref+(ok?'\n✓ Guardado en base de datos':'\n⚠ Sin conexión — guardado localmente'));
  });
  cobSel={};
  const aluSel=document.getElementById('cob-alu');if(aluSel)aluSel.value='';
  document.getElementById('cob-wrap').style.display='none';
  document.getElementById('cob-res').classList.remove('vis');
}
function cobrarDesdeMatricula(idx){
  sp('sec','s-cob','ns-cob');
  setTimeout(()=>{
    const sel=document.getElementById('cob-alu');
    if(sel){sel.value=idx;loadMeses();}
  },100);
}
function genWA(){
  const idx=parseInt(document.getElementById('cob-alu').value);if(isNaN(idx))return;
  const a=ALUMNOS[idx];
  const keys=Object.keys(cobSel).map(Number);

function genWAECA(){
  const idx=parseInt(document.getElementById('eca-alu').value);if(isNaN(idx))return;

  const url='https://wa.me/58'+a.tel.replace(/[^0-9]/g,'').slice(1)+'?text='+encodeURIComponent(msg);

}

function acPartida(){
  const q=document.getElementById('eg-partida-input').value.toLowerCase();
  const drop=document.getElementById('eg-partida-drop');
  if(q.length<2){drop.style.display='none';return;}

  const c=document.getElementById('iva-ops-wrap');if(!c)return;

function calcIvaBase(i){
  const monto=parseFloat(ivaOps[i].m)||0;const pct=parseFloat(ivaOps[i].ali)||16;const base=monto/(1+pct/100);
  ivaOps[i].base=base.toFixed(2);const el=document.getElementById('iva-base-'+i);if(el)el.value=ivaOps[i].base;
}
function acIVA(){
  const q=document.getElementById('iva-prov').value.toLowerCase();const drop=document.getElementById('iva-drop');
  if(q.length<2){drop.style.display='none';return;}
  const m=PROVS.filter(p=>p.n.toLowerCase().includes(q)||p.r.toLowerCase().includes(q));
  if(!m.length){drop.style.display='none';return;}
  drop.innerHTML=m.map(p=>`<div class="ac-item" onclick="selProvIVA('${p.n}','${p.r}')">${p.n}<small>${p.r}</small></div>`).join('');drop.style.display='block';
}

  const pi=document.getElementById('iva-prov'),ri=document.getElementById('iva-rif');

}

function calcEsp(){
  const tar=parseFloat(document.getElementById('esp-sel').value)||0;const h=parseFloat(document.getElementById('esp-h').value)||0;
  const prev=document.getElementById('esp-prev');if(!tar||!h){prev.style.display='none';return;}
  const bruto=h*tar*BCV;const ret=bruto*0.05;const neto=bruto-ret;
  document.getElementById('esp-vals').innerHTML=`<div><div style="font-size:11px;color:var(--pd);font-weight:600">BRUTO</div><div style="font-weight:700;font-size:14px">Bs. ${fmt(bruto)}</div><div style="font-size:11px;color:var(--text2)">USD ${(bruto/BCV).toFixed(2)}</div></div><div><div style="font-size:11px;color:var(--pd);font-weight:600">RETENCIÓN 5%</div><div style="font-weight:700;font-size:14px;color:#A32D2D">Bs. ${fmt(ret)}</div></div><div><div style="font-size:11px;color:var(--pd);font-weight:600">NETO A PAGAR</div><div style="font-weight:700;font-size:14px;color:#3B6D11">Bs. ${fmt(neto)}</div></div>`;
  prev.style.display='block';
}

// GOOGLE SHEETS — BASE DE DATOS
// ═══════════════════════════════
let dbStatus = 'connecting'; // connecting | ok | error

async function dbRead(tab){
  try{
    const url = SHEETS_URL + '?action=read&tab=' + encodeURIComponent(tab);
    const res = await fetch(url, {redirect:'follow'});
    const data = await res.json();
    if(data.ok) return data.data;
    console.error('dbRead error:', data.error);
    return null;
  }catch(e){console.error('dbRead fetch error:',e);return null;}
}

async function dbAppend(tab, row){
  try{
    const res = await fetch(SHEETS_URL, {
      method:'POST',
      redirect:'follow',
      headers:{'Content-Type':'text/plain'},
      body: JSON.stringify({action:'append', tab:tab, row:row})
    });
    const data = await res.json();
    return data.ok;
  }catch(e){console.error('dbAppend error:',e);return false;}
}

async function dbInitTabs(){
  try{
    const res = await fetch(SHEETS_URL, {
      method:'POST',
      redirect:'follow',
      headers:{'Content-Type':'text/plain'},
      body: JSON.stringify({action:'init_tabs'})
    });
    const data = await res.json();
    console.log('Init tabs:', data);
    return data.ok;
  }catch(e){console.error('dbInitTabs error:',e);return false;}
}

async function testDB(){
  const el = document.getElementById('db-status');
  if(el){el.textContent='Conectando...';el.style.color='#BA7517';}
  try{
    const url = SHEETS_URL + '?action=ping';
    const res = await fetch(url, {redirect:'follow'});
    const text = await res.text();
    const data = JSON.parse(text);
    if(data.ok){
      dbStatus = 'ok';
      if(el){el.textContent='✓ Base de datos conectada';el.style.color='#3B6D11';}
      console.log('DB OK');
      return true;
    } else {
      throw new Error(data.error||'Error desconocido');
    }
  }catch(e){
    dbStatus = 'error';
    if(el){el.textContent='⚠ Sin conexión a BD — modo local';el.style.color='#A32D2D';}
    console.warn('DB sin conexión:', e.message);
    return false;
  }
}

// Guardar cobro en Sheets
async function saveCobro(alumno, meses, total, banco, fecha, tasa, ref){
  const row = [
    fecha,
    alumno,
    meses.join(','),
    total,
    banco,
    tasa,
    ref,
    new Date().toISOString()
  ];
  const ok = await dbAppend('Cobros', row);
  if(!ok) console.warn('Cobro no guardado en Sheets');
  return ok;
}

// Guardar egreso en Sheets
async function saveEgreso(fecha, partida, proveedor, monto, banco, factura){
  const row = [fecha, partida, proveedor, monto, banco, factura, new Date().toISOString()];
  const ok = await dbAppend('Egresos', row);
  if(!ok) console.warn('Egreso no guardado en Sheets');
  return ok;
}

// Guardar alumno en Sheets
async function saveAlumno(nombre, grado, tipo, turno, representante, telefono, mesIngreso){
  const row = [nombre, grado, tipo, turno, representante, telefono, mesIngreso, new Date().toISOString()];
  const ok = await dbAppend('Alumnos', row);
  if(!ok) console.warn('Alumno no guardado en Sheets');
  return ok;
}
